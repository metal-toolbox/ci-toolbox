name: build and publish docker image

on:
  workflow_dispatch:
  workflow_call:
    secrets:
      token:
        required: false
    inputs:
      runs-on:
        type: string
        required: false
        default: ubuntu-latest
      # artifacts
      artifact-name:
        required: false
        type: string
        description: |
          The name of the artifact to download from the build-go job.
          Workflow will skip downloading artifact if this input is empty.
      artifact-path:
        required: false
        type: string
        default: bin
        description: The path where the artifact is stored in the build-go job.
      # registries
      registry:
        type: string
        required: false
        default: ghcr.io
      user:
        type: string
        required: false
        default: ${{ github.actor }}
      # buildz
      image-repo:
        type: string
        required: true
        description: The full image repository, e.g. ghcr.io/owner/repo/image
      image-tag:
        type: string
        description: The tag to use for the image.
        required: true
      sbom:
        type: boolean
        description: Whether to generate an SBOM for the built image.
        required: false
        default: true
      build-args:
        type: string
        description: Build arguments to pass to docker build
        required: false
      push:
        type: boolean
        description: Whether to push the image to the registry.
        required: false
        default: true
      context:
        type: string
        description: The build context for the docker build command.
        required: false
        default: .
      dockerfile:
        type: string
        description: The path to the Dockerfile.
        required: false
        default: Dockerfile

jobs:
  build-docker:
    name: build and publish docker image
    permissions:
      contents: write
      packages: write
      id-token: write
    runs-on: ${{ inputs.runs-on }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: login registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ inputs.registry }}
          username: ${{ inputs.user }}
          password: ${{ secrets.token || github.token }}
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: sigstore/cosign-installer@v3.10.1
      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        id: meta
        with:
          images: ${{ inputs.image-repo }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ inputs.artifact-name != '' }}
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.artifact-path }}
      - name: build and push
        id: build-push
        uses: docker/build-push-action@601a80b39c9405e50806ae38af30926f9d957c47 # v6.19.1
        with:
          sbom: ${{ inputs.sbom }}
          context: ${{ inputs.context }}
          push: ${{ inputs.push }}
          file: ${{ inputs.dockerfile }}
          build-args: ${{ inputs.build-args }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: |
            ${{ steps.meta.outputs.tags }}
            ${{ inputs.image-repo }}:${{ inputs.image-tag }}
      - name: sign image
        if: ${{ inputs.push }}
        run: cosign sign --yes ${{ inputs.image-repo }}@${{ steps.build-push.outputs.digest }}
