name: build and publish docker image

on:
  workflow_dispatch:
  workflow_call:
    secrets:
      token:
        required: false
    inputs:
      runs-on:
        type: string
        required: false
        default: ubuntu-latest
      # artifacts
      artifact-name:
        required: false
        type: string
        description: |
          The name of the artifact to download from the build-go job.
          Workflow will skip downloading artifact if this input is empty.
      artifact-path:
        required: false
        type: string
        default: bin
        description: The path where the artifact is stored in the build-go job.
      # registries
      registry:
        type: string
        required: false
        default: ghcr.io
      user:
        type: string
        required: false
        default: ${{ github.actor }}
      # buildz
      image-repo:
        type: string
        required: true
        description: The full image repository, e.g. ghcr.io/owner/repo/image
      image-tag:
        type: string
        description: The tag to use for the image.
        required: true
      sbom:
        type: boolean
        description: Whether to generate an SBOM for the built image.
        required: false
        default: true
      build-args:
        type: string
        description: Build arguments to pass to docker build
        required: false
      push:
        type: boolean
        description: Whether to push the image to the registry.
        required: false
        default: true
      context:
        type: string
        description: The build context for the docker build command.
        required: false
        default: .
      dockerfile:
        type: string
        description: The path to the Dockerfile.
        required: false
        default: Dockerfile

jobs:
  build-docker:
    name: build and publish docker image
    permissions:
      contents: write
      packages: write
      id-token: write
    runs-on: ${{ inputs.runs-on }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: login registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ inputs.registry }}
          username: ${{ inputs.user }}
          password: ${{ secrets.token || github.token }}
      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
      - uses: sigstore/cosign-installer@v4.1.2
      - uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        id: meta
        with:
          images: ${{ inputs.image-repo }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ inputs.artifact-name != '' }}
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.artifact-path }}
      - name: build and push
        id: build-push
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          sbom: ${{ inputs.sbom }}
          context: ${{ inputs.context }}
          push: ${{ inputs.push }}
          file: ${{ inputs.dockerfile }}
          build-args: ${{ inputs.build-args }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: |
            ${{ steps.meta.outputs.tags }}
            ${{ inputs.image-repo }}:${{ inputs.image-tag }}
      - name: sign image
        if: ${{ inputs.push }}
        run: cosign sign --yes ${{ inputs.image-repo }}@${{ steps.build-push.outputs.digest }}
