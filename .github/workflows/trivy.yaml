name: trivy scan

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      runs-on:
        type: string
        required: false
        default: ubuntu-latest
      scan-type:
        type: string
        required: false
        default: fs
        description: 'The type of scan: fs (filesystem), image, repo, etc.'
      image-ref:
        type: string
        required: false
        description: 'The image to scan (required if scan-type is image)'
      scan-ref:
        type: string
        required: false
        default: '.'
        description: 'The path or reference to scan (default: . for filesystem)'

jobs:
  trivy-scan:
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: full scan with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        env:
          TRIVY_DEBUG: true
        with:
          scan-type: ${{ inputs.scan-type }}
          image-ref: ${{ inputs.image-ref }}
          scan-ref: ${{ inputs.scan-ref }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          exit-code: '0'
      - name: fail with high critical
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          scan-type: ${{ inputs.scan-type }}
          image-ref: ${{ inputs.image-ref }}
          scan-ref: ${{ inputs.scan-ref }}
          format: 'table'
          severity: 'HIGH,CRITICAL'
          output: 'trivy-results.txt'
          exit-code: '1'
      - name: job summary
        run: |
          # step summary
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat trivy-results.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
      - name: Upload Trivy results to Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          sarif_file: 'trivy-results.sarif'
