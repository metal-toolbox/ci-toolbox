name: Create commit short SHA output

description: 'This action takes a full commit SHA and outputs the shortened version (first 8 characters)'

inputs:
  sha:
    description: 'The full commit SHA to shorten'
    required: true
    default: '${{ github.sha }}'

outputs:
  short-sha:
    description: 'The shortened commit SHA (first 8 characters)'
    value: ${{ steps.short-sha.outputs.short-sha }}

runs:
  using: composite
  steps:
    - id: short-sha
      shell: bash
      run: |
        SHA="${{ inputs.sha }}"
        echo "short-sha=${SHA:0:8}" >> $GITHUB_OUTPUT
