name: build go

description: 'checkout, build go binaries, and upload as artifact'

inputs:
  output:
    description: 'path to the output binary'
    required: true
  artifact-name:
    description: 'name of the artifact to upload'
    required: false
    default: 'go-build'
  build-cmd:
    description: 'override go build command to run'
    required: false
  version-file: 
    description: Path to the go.mod, go.work, .go-version, or .tool-versions file.
    required: false
    default: 'go.mod'

runs:
  using: composite
  steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
    - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
      with:
        go-version-file: ${{ inputs.version-file }}
    - name: build
      shell: bash
      run: |
        if [ -z "${{ inputs.build-cmd }}" ]; then
          go build -buildvcs=false -mod=mod -a -o ${{ inputs.output }}
        else
          eval "${{ inputs.build-cmd }}"
        fi
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ inputs.output }}
