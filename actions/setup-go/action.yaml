name: setup go

description: 'checkout and setup go environment'

inputs:
  version-file: 
    description: Path to the go.mod, go.work, .go-version, or .tool-versions file.
    required: false
    default: 'go.mod'

runs:
  using: composite
  steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
    - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
      with:
        go-version-file: ${{ inputs.version-file }}
